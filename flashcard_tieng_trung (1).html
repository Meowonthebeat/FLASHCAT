<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Tiếng Trung</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:#f5f8fc;color:#1f2937;min-height:100vh}
button,input,textarea,select{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:24px 22px 45px}
.topbar{background:#fff;border:2px solid #26313f;border-radius:30px;padding:18px 26px 16px;box-shadow:0 5px 12px #00000012}
.toprow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.stats{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.coin{font-size:21px}
.counter{font-size:20px}
.spacer{flex:1}
.mode{display:flex;align-items:center;gap:9px;background:#edf2f7;border-radius:20px;padding:7px 12px;font-weight:700}
.switch{width:38px;height:22px;border-radius:20px;background:#cbd5e1;position:relative;cursor:pointer}
.switch:after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s}
.switch.on{background:#22c55e}.switch.on:after{left:18px}
.linkbtn{border:0;background:none;color:#0ea5e9;font-weight:700;cursor:pointer;font-size:16px}
.progress{height:10px;background:#e5e7eb;border-radius:10px;margin-top:15px;overflow:hidden}
.progressbar{height:100%;background:#58d500;border-radius:10px;width:0%;transition:.3s}
.card-wrap{display:flex;justify-content:center;margin:22px 0 34px}
.card{width:min(750px,90vw);height:500px;perspective:1200px;cursor:pointer}
.card-inner{height:100%;width:100%;position:relative;transition:transform .55s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px;text-align:center;color:#111827;box-shadow:0 18px 35px #00000018;overflow:auto}
.front{background:linear-gradient(135deg,#637de5,#7a49a9)}
.back{background:#fff;transform:rotateY(180deg);align-items:flex-start;text-align:left}
.word{font-size:72px;font-weight:800;margin-bottom:20px}
.part{display:inline-block;background:#ffffff99;border-radius:20px;padding:9px 18px;font-weight:700;text-transform:uppercase}
.hint{position:absolute;bottom:30px;color:#fff9;font-size:15px}
.back h2{width:100%;text-align:center;font-size:32px;margin:0 0 22px}
.info{width:100%;display:grid;gap:12px;font-size:18px;line-height:1.55}
.info div{background:#f7f9fc;border-radius:12px;padding:10px 14px}
.info b{color:#4f46e5}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}
.nav{border:0;background:none;color:#8bcaf0;font-weight:700;font-size:18px;cursor:pointer}
.action{border:0;border-radius:30px;padding:14px 30px;background:#50d000;color:white;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 4px 9px #00000018}
.action:hover{filter:brightness(.95)}
.sound{width:62px;height:50px;border-radius:28px;border:0;background:#50d000;color:white;font-size:22px;cursor:pointer}
.keyboard{display:flex;justify-content:center;gap:35px;color:#a5b5c8;font-size:14px;margin-top:10px}
.panel{background:#fff;border-radius:24px;padding:24px;margin-top:30px;box-shadow:0 8px 25px #0000000c;border:1px solid #e5e7eb}
.panel h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:700}
input,textarea,select{border:1px solid #d5dce5;border-radius:12px;padding:11px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#6366f1}
textarea{min-height:125px;resize:vertical}
.full{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.secondary{border:0;background:#eaf0f7;color:#334155;border-radius:12px;padding:11px 17px;font-weight:700;cursor:pointer}
.danger{background:#fee2e2;color:#b91c1c}
.word-list{margin-top:18px;max-height:330px;overflow:auto;border:1px solid #e5e7eb;border-radius:12px}
.word-item{display:flex;justify-content:space-between;gap:15px;padding:12px 15px;border-bottom:1px solid #edf0f4;align-items:center}
.word-item:last-child{border-bottom:0}
.word-item small{color:#64748b}
.delete{border:0;background:#fee2e2;color:#dc2626;border-radius:9px;padding:7px 10px;cursor:pointer}
.hidden{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:#1f2937;color:#fff;padding:12px 17px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:700px){
.app{padding:12px}.topbar{padding:15px}.card{height:470px}.word{font-size:52px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.keyboard{gap:15px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="toprow">
    <div class="stats"><span class="coin">🪙</span><span id="score">0</span></div>
    <div class="counter"><span id="current">1</span> / <span id="total">0</span></div>
    <div class="spacer"></div>
    <div class="mode">Từ → Nghĩa <span id="modeSwitch" class="switch" title="Đổi chế độ"></span></div>
    <button class="linkbtn" onclick="restart()">↻ Chơi lại</button>
    <button class="linkbtn" onclick="exitApp()">Thoát</button>
  </div>
  <div class="progress"><div id="progressBar" class="progressbar"></div></div>
</header>

<main>
<div class="card-wrap">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-inner">
      <section class="face front" id="front"></section>
      <section class="face back" id="back"></section>
    </div>
  </div>
</div>

<div class="controls">
  <button class="nav" onclick="prevCard()">← Trước</button>
  <button class="sound" onclick="event.stopPropagation(); speakCurrent()">🔊</button>
  <button class="action" onclick="event.stopPropagation(); markForgot()">× &nbsp;Quên</button>
  <button class="action" onclick="event.stopPropagation(); markKnown()">✓ &nbsp;Thuộc</button>
  <button class="nav" onclick="nextCard()">Tiếp →</button>
</div>
<div class="keyboard"><span>Phím ←</span><span>Phím S</span><span>Phím 1/X</span><span>Phím 2/C</span><span>Phím →</span></div>

<section class="panel">
<h2>➕ Thêm từ mới</h2>
<div class="grid">
  <div class="field"><label>Chữ Hán *</label><input id="hanzi" placeholder="Ví dụ: 四面八方"></div>
  <div class="field"><label>Pinyin *</label><input id="pinyin" placeholder="Ví dụ: sì miàn bā fāng"></div>
  <div class="field"><label>Từ loại</label><input id="type" placeholder="Ví dụ: Thành ngữ / Động từ"></div>
  <div class="field"><label>Nghĩa tiếng Việt *</label><input id="meaning" placeholder="Ví dụ: Bốn phương tám hướng"></div>
  <div class="field full"><label>Ví dụ</label><input id="example" placeholder="Ví dụ tiếng Trung"></div>
  <div class="field full"><label>Mẹo nhớ</label><input id="memory" placeholder="Mẹo liên tưởng để dễ nhớ"></div>
</div>
<div class="row">
  <button class="action" onclick="addWord()">➕ Thêm từ</button>
  <button class="secondary" onclick="clearForm()">Xóa ô nhập</button>
</div>
</section>

<section class="panel">
<h2>📥 Nhập hàng loạt</h2>
<p>Nhập mỗi từ một dòng theo định dạng: <b>Chữ Hán | Pinyin | Từ loại | Nghĩa | Ví dụ | Mẹo nhớ</b></p>
<textarea id="bulk" placeholder="四面八方 | sì miàn bā fāng | Thành ngữ | Bốn phương tám hướng | 从四面八方传来了阵阵回声 | 四面=4 mặt，八方=8 phương"></textarea>
<div class="row">
  <button class="action" onclick="importBulk()">📥 Nhập danh sách</button>
  <button class="secondary" onclick="shuffleWords()">🔀 Trộn từ</button>
  <button class="secondary" onclick="exportWords()">📤 Xuất dữ liệu</button>
  <button class="secondary danger" onclick="resetAll()">🗑️ Xóa toàn bộ</button>
</div>
</section>

<section class="panel">
<h2>📚 Danh sách từ (<span id="listCount">0</span>)</h2>
<input id="search" placeholder="🔍 Tìm chữ Hán, pinyin hoặc nghĩa..." oninput="renderList()">
<div class="word-list" id="wordList"></div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const defaultWords = [
["四面八方","sì miàn bā fāng","Thành ngữ","Bốn phương tám hướng, khắp nơi","从四面八方传来了阵阵“喂……”的回声","四面=4 mặt + 八方=8 phương → khắp mọi hướng"],
["不假思索","bù jiǎ sī suǒ","Thành ngữ","Không cần suy nghĩ, không mảy may do dự","驾驶者不假思索地答道……","假=thực hiện/nhờ; 思索=suy nghĩ → không cần suy nghĩ"],
["语无伦次","yǔ wú lún cì","Thành ngữ","Nói năng lộn xộn, không mạch lạc","喝多了，说话总是语无伦次的","Lời nói không có thứ tự"],
["融为一体","róng wéi yī tǐ","Thành ngữ","Hòa làm một, hòa quyện vào nhau","将人与自然融为一体","融= hòa + 为一体= thành một thể"],
["迷惑不解","mí huò bù jiě","Thành ngữ","Hoang mang, khó hiểu","他迷惑不解地问","迷惑=hoang mang + 不解=không hiểu"],
["不知所措","bù zhī suǒ cuò","Thành ngữ","Bối rối, không biết phải làm sao","书店老板一时不知所措","Không biết nên làm gì"],
["斤斤计较","jīn jīn jì jiào","Thành ngữ","So đo tính toán, chi li từng tí","很少有“80后”会为了薪水斤斤计较","计较 từng chút → so đo chi li"],
["一事无成","yī shì wú chéng","Thành ngữ","Không làm nên trò trống gì","几年下来，依然一事无成","一事=việc gì + 无成=không thành"],
["若有所思","ruò yǒu suǒ sī","Thành ngữ","Có vẻ như đang suy nghĩ điều gì đó","青年若有所思地点了点头","Trông như đang suy nghĩ"],
["恍然大悟","huǎng rán dà wù","Thành ngữ","Bỗng nhiên tỉnh ngộ, chợt nhận ra","青年恍然大悟","恍然=đột nhiên nhận ra + 大悟=hiểu ra"],
["删繁就简","shān fán jiù jiǎn","Thành ngữ","Bớt rườm rà, giữ lại cái đơn giản/cốt lõi","只有删繁就简，从最近的目标开始","删繁=xóa cái phức tạp → giữ cái đơn giản"],
["半途而废","bàn tú ér fèi","Thành ngữ","Bỏ cuộc, bỏ dở giữa chừng","万事挂怀，只会半途而废","半途=giữa đường + 废=bỏ"],
["安安稳稳","ān ān wěn wěn","Từ láy","Bình yên, an ổn","靠呆在家里安安稳稳地看电视","安=yên + 稳=ổn"],
["如愿以偿","rú yuàn yǐ cháng","Thành ngữ","Được như ý nguyện, cầu được ước thấy","今天晚上我就让你如愿以偿","如愿=như mong muốn"],
["妙不可言","miào bù kě yán","Thành ngữ","Tuyệt diệu không nói nên lời","真是妙不可言","妙=tuyệt diệu + 不可言=không thể diễn tả"],
["一动不动","yī dòng bù dòng","Thành ngữ","Không nhúc nhích, đứng im","一动不动地看着酒店","Hoàn toàn không chuyển động"],
["犹豫","yóu yù","Động từ","Do dự, chần chừ","他犹豫了很久，还是没有做决定","Chưa quyết định được → 犹豫"],
["面临","miàn lín","Động từ","Đối mặt với, đứng trước","我们正面临一个新的挑战","面=đối diện + 临=đến gần"],
["逃避","táo bì","Động từ","Trốn tránh, né tránh","逃避责任并不能解决问题","逃=chạy trốn + 避=tránh"],
["冷漠","lěng mò","Tính từ","Lạnh nhạt, thờ ơ","他对周围的人很冷漠","冷=lạnh + 漠=hờ hững"],
["不妨","bù fáng","Phó từ","Không ngại gì, cứ thử xem","不妨问问自己","Dùng để đưa ra lời khuyên nhẹ nhàng"],
["执照","zhí zhào","Danh từ","Giấy phép","驾驶执照","驾驶执照=bằng lái xe"],
["正宗","zhèng zōng","Tính từ","Chính tông, chính gốc, đúng chuẩn","最正宗的川菜","正=đúng + 宗=gốc"],
["设想","shè xiǎng","Động từ/Danh từ","Giả định, tưởng tượng; ý tưởng","我们可以设想一下未来的生活","设=đặt ra + 想=nghĩ"],
["倾诉","qīng sù","Động từ","Dốc bầu tâm sự, bộc bạch","他向智者倾诉自己的烦恼","倾=trút ra + 诉=kể"],
["导致","dǎo zhì","Động từ","Dẫn đến, gây ra","导致学习成绩下降","导=dẫn + 致=đưa đến"],
["沸腾","fèi téng","Động từ/Tính từ","Sôi sục, sục sôi","听到这个消息，大家的心都沸腾了","Nước sôi; cảm xúc cũng có thể sục sôi"],
["绘制","huì zhì","Động từ","Vẽ, phác họa","绘制地图","绘=vẽ + 制=tạo ra"],
["交界","jiāo jiè","Danh từ","Ranh giới, nơi tiếp giáp","这里是两个省的交界","交=giao nhau + 界=giới hạn"],
["题材","tí cái","Danh từ","Đề tài, chủ đề sáng tác","这部电影的题材很新颖","Thường dùng cho văn học, điện ảnh, hội họa"],
["欢呼","huān hū","Động từ","Hoan hô, reo hò","人们为胜利欢呼","欢=vui + 呼=hô"],
["遍布","biàn bù","Động từ","Phân bố khắp nơi","公园里遍布着各种各样的花","遍=khắp + 布=phân bố"],
["承担","chéng dān","Động từ","Gánh vác, đảm đương, chịu trách nhiệm","我们应该承担自己的责任","承=nhận + 担=gánh"],
["阻止","zǔ zhǐ","Động từ","Ngăn cản, ngăn chặn","没有人能够阻止他实现自己的梦想","阻=cản + 止=dừng"],
["忽视","hū shì","Động từ","Xem nhẹ, lơ là, phớt lờ","我们不能忽视这个问题","忽=lơ là + 视=nhìn"],
["安慰","ān wèi","Động từ/Danh từ","An ủi","她安慰了伤心的朋友","安=yên + 慰=an ủi"],
["限制","xiàn zhì","Động từ/Danh từ","Hạn chế, giới hạn","这项规定限制了我们的选择","Đặt ra giới hạn"],
["包含","bāo hán","Động từ","Bao hàm, chứa đựng","这本书包含很多有用的信息","包=bao + 含=chứa"],
["情绪","qíng xù","Danh từ","Cảm xúc, tâm trạng","最近他的情绪不太好","情绪很好= tâm trạng rất tốt"],
["幻想","huàn xiǎng","Động từ/Danh từ","Ảo tưởng, mộng tưởng, tưởng tượng","不要总是生活在幻想中","幻=ảo + 想=nghĩ"],
["模糊","mó hu","Tính từ/Động từ","Mơ hồ, không rõ ràng, mờ nhạt","我的记忆已经很模糊了","Không rõ về hình ảnh hoặc khái niệm"],
["夸张","kuā zhāng","Động từ/Tính từ","Khoa trương, phóng đại","他说得太夸张了","Nói quá sự thật"],
["规模","guī mó","Danh từ","Quy mô","这家公司的规模很大","规模大/小=quy mô lớn/nhỏ"],
["危害","wēi hài","Danh từ/Động từ","Tác hại, mối nguy hiểm; gây hại","吸烟会危害身体健康","危=nguy + 害=hại"],
["豪华","háo huá","Tính từ","Hào hoa, sang trọng, xa hoa","这是一家豪华酒店","豪华酒店=khách sạn sang trọng"],
["充足","chōng zú","Tính từ","Đầy đủ, dồi dào","我们有充足的时间准备考试","充=đầy + 足=đủ"],
["业余","yè yú","Tính từ/Danh từ","Nghiệp dư; lúc rảnh rỗi","我喜欢在业余时间学习中文","业余时间=thời gian rảnh"]
];

let words = JSON.parse(localStorage.getItem("cnFlashcards") || "null") || defaultWords.map(x=>({hanzi:x[0],pinyin:x[1],type:x[2],meaning:x[3],example:x[4],memory:x[5],known:false}));
let index=0, flipped=false, score=0, reverse=false;

function save(){localStorage.setItem("cnFlashcards",JSON.stringify(words))}
function render(){
  if(!words.length){document.getElementById("front").innerHTML="<div class='word'>Chưa có từ</div>";document.getElementById("back").innerHTML="<h2>Hãy thêm từ mới</h2>";document.getElementById("total").textContent=0;return}
  if(index>=words.length)index=0;if(index<0)index=words.length-1;
  const w=words[index];
  document.getElementById("total").textContent=words.length;
  document.getElementById("current").textContent=index+1;
  document.getElementById("score").textContent=score;
  document.getElementById("progressBar").style.width=((index+1)/words.length*100)+"%";
  const frontContent=reverse?`<div class="word">${w.meaning}</div><div class="part">NGHĨA TIẾNG VIỆT</div>`:`<div class="word">${w.hanzi}</div><div class="part">${w.type||"TỪ VỰNG"}</div>`;
  const backContent=reverse?`<h2>${w.hanzi}</h2><div class="info"><div><b>Pinyin:</b> ${w.pinyin}</div><div><b>Từ loại:</b> ${w.type||"—"}</div><div><b>Nghĩa:</b> ${w.meaning}</div><div><b>Ví dụ:</b> ${w.example||"—"}</div><div><b>Mẹo nhớ:</b> ${w.memory||"—"}</div></div>`:`<h2>${w.hanzi}</h2><div class="info"><div><b>Pinyin:</b> ${w.pinyin}</div><div><b>Từ loại:</b> ${w.type||"—"}</div><div><b>Nghĩa:</b> ${w.meaning}</div><div><b>Ví dụ:</b> ${w.example||"—"}</div><div><b>Mẹo nhớ:</b> ${w.memory||"—"}</div></div>`;
  document.getElementById("front").innerHTML=frontContent+`<div class="hint">Nhấn Space hoặc click để lật</div>`;
  document.getElementById("back").innerHTML=backContent;
  document.getElementById("card").classList.toggle("flipped",flipped);
  document.getElementById("modeSwitch").classList.toggle("on",reverse);
  renderList();
}
function flipCard(){flipped=!flipped;document.getElementById("card").classList.toggle("flipped",flipped)}
function nextCard(){if(!words.length)return;index=(index+1)%words.length;flipped=false;render()}
function prevCard(){if(!words.length)return;index=(index-1+words.length)%words.length;flipped=false;render()}
function markKnown(){if(!words.length)return;words[index].known=true;score++;save();toast("✓ Đã đánh dấu Thuộc");nextCard()}
function markForgot(){if(!words.length)return;words[index].known=false;score=Math.max(0,score-1);save();toast("× Đã đánh dấu Quên");nextCard()}
function restart(){index=0;score=0;flipped=false;render();toast("Đã chơi lại")}
function shuffleWords(){for(let i=words.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}index=0;flipped=false;save();render();toast("Đã trộn danh sách")}
function addWord(){
  const w={hanzi:val("hanzi"),pinyin:val("pinyin"),type:val("type"),meaning:val("meaning"),example:val("example"),memory:val("memory"),known:false};
  if(!w.hanzi||!w.pinyin||!w.meaning){toast("Vui lòng nhập Chữ Hán, Pinyin và Nghĩa");return}
  words.push(w);save();index=words.length-1;flipped=false;clearForm();render();toast("Đã thêm từ mới")
}
function importBulk(){
  const text=document.getElementById("bulk").value.trim();if(!text){toast("Chưa có dữ liệu");return}
  let count=0;
  text.split(/\n+/).forEach(line=>{let p=line.split("|").map(s=>s.trim());if(p[0]&&p[1]&&p[3]){words.push({hanzi:p[0],pinyin:p[1],type:p[2]||"",meaning:p[3],example:p[4]||"",memory:p[5]||"",known:false});count++}});
  save();document.getElementById("bulk").value="";index=words.length-count;flipped=false;render();toast(`Đã nhập ${count} từ`)
}
function renderList(){
  const q=(document.getElementById("search")?.value||"").toLowerCase();
  const list=words.map((w,i)=>({w,i})).filter(x=>[x.w.hanzi,x.w.pinyin,x.w.meaning].join(" ").toLowerCase().includes(q));
  document.getElementById("listCount").textContent=words.length;
  document.getElementById("wordList").innerHTML=list.map(x=>`<div class="word-item"><div><b>${x.w.hanzi}</b> <small>${x.w.pinyin} · ${x.w.meaning}</small></div><button class="delete" onclick="deleteWord(${x.i})">Xóa</button></div>`).join("")||"<div style='padding:15px'>Không tìm thấy từ.</div>"
}
function deleteWord(i){if(!confirm("Xóa từ này?"))return;words.splice(i,1);if(index>=words.length)index=Math.max(0,words.length-1);save();render();toast("Đã xóa")}
function resetAll(){if(!confirm("Xóa toàn bộ dữ liệu từ vựng đã lưu?"))return;localStorage.removeItem("cnFlashcards");words=[];index=0;score=0;render();toast("Đã xóa toàn bộ")}
function exportWords(){const blob=new Blob([JSON.stringify(words,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="flashcard_tieng_trung.json";a.click();URL.revokeObjectURL(a.href)}
function clearForm(){["hanzi","pinyin","type","meaning","example","memory"].forEach(id=>document.getElementById(id).value="")}
function val(id){return document.getElementById(id).value.trim()}
function speakCurrent(){if(!words.length)return;let text=words[index].hanzi;let u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function exitApp(){toast("Bạn có thể đóng tab trình duyệt để thoát")}
document.getElementById("modeSwitch").onclick=()=>{reverse=!reverse;flipped=false;render()};
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
 if(e.code==="Space"){e.preventDefault();flipCard()}
 else if(e.key==="ArrowRight")nextCard();
 else if(e.key==="ArrowLeft")prevCard();
 else if(e.key.toLowerCase()==="s")speakCurrent();
 else if(e.key==="1"||e.key.toLowerCase()==="x")markForgot();
 else if(e.key==="2"||e.key.toLowerCase()==="c")markKnown();
});
render();
</script>
</body>
</html>
